
<div id="modal-sections" uk-modal>
    <div class="uk-modal-dialog add-card-style" style="width: 1500px;">
        <button class="uk-modal-close-default" type="button" uk-close></button>
        <div class="uk-modal-header">
            <h2 class="uk-modal-title" class="text-style">Adicionar um desejo!</h2>
        </div>
        <div class="uk-modal-body">
            <form [formGroup]="form">
                <div class="uk-card uk-form-controls uk-card-body uk-box-shadow-small" id="login-color"> 

                  <div class="uk-margin">
                    <input class="uk-input uk-form-large" formControlName="titulo" type="email" placeholder="Titulo"
                    [ngClass]="{'uk-form-danger': (!form.controls['titulo'].valid)}">
                  </div>
          
                  <div class="uk-margin">
                    <input class="uk-input uk-form-large" style="height: 150px; text-align: center;" formControlName="descricao" type="text" placeholder="Descricao"
                    [ngClass]="{'uk-form-danger': (!form.controls['descricao'].valid)}">
                  </div>          
                </div>
            </form>
        </div>
        <div class="uk-modal-footer uk-text-right">
            <button class="uk-button uk-button-default button-cancel-style uk-modal-close" type="button">Cancelar</button>
            <button class="uk-button uk-button-primary button-save-style uk-modal-close" type="button" (click)="save()">Salvar
            </button>
        </div>
    </div>
</div>
