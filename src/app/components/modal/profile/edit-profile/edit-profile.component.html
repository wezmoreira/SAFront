<div class="uk-flex-center" uk-grid>
    <div class="uk-width-1-3@m">
      <p class="uk-text-center uk-margin-large-top uk-margin-medium-bottom">
        <span>
          <img src="assets/images/ifood-43.png" style="width: 10%; height: 10%" />
        </span>
      </p>
  
      <form [formGroup]="form">
        <div
          class="uk-card uk-card-primary uk-card-body uk-box-shadow-small"
          id="login-color"
        >
          <h3 class="uk-card-title">Cadastre-se</h3>
  
          <div class="uk-margin">
            <input
              class="uk-input uk-form-large"
              formControlName="email"
              type="email"
              placeholder="Email"
              [ngClass]="{ 'uk-form-danger': !form.controls['email'].valid }"
            />
          </div>
  
          <div class="uk-margin">
            <input
              class="uk-input uk-form-large"
              formControlName="username"
              type="text"
              placeholder="Username"
              [ngClass]="{ 'uk-form-danger': !form.controls['username'].valid }"
            />
          </div>
  
          <div class="uk-margin">
            <input
              class="uk-input uk-form-large"
              formControlName="password"
              type="password"
              placeholder="Senha"
              [ngClass]="{ 'uk-form-danger': !form.controls['password'].valid }"
            />
          </div>
  
          <div class="uk-margin" style="display: flex; gap: 10px;">
            <input
              style="flex: 4;"
              class="uk-input uk-form-large"
              formControlName="city"
              type="text"
              placeholder="Cidade"
              [ngClass]="{ 'uk-form-danger': !form.controls['city'].valid }"
            />
  
            <input
              style="flex: 1;"
              class="uk-input uk-form-large"
              formControlName="state"
              type="text"
              placeholder="Estado"
              [ngClass]="{ 'uk-form-danger': !form.controls['state'].valid }"
              maxlength="2"
            />
  
            <input
              style="flex: 1;"
              class="uk-input uk-form-large"
              formControlName="cep"
              type="text"
              placeholder="Cep"
              [ngClass]="{ 'uk-form-danger': !form.controls['cep'].valid }"
            />
          </div>
  
          <div class="uk-margin" style="display: flex; gap: 10px;">
            <input
              style="flex: 4;"
              class="uk-input uk-form-large"
              formControlName="address"
              type="text"
              placeholder="Endereço"
              [ngClass]="{ 'uk-form-danger': !form.controls['address'].valid }"
            />
            <input
              style="flex: 1;"
              class="uk-input uk-form-large"
              formControlName="number"
              type="text"
              placeholder="Número"
              [ngClass]="{ 'uk-form-danger': !form.controls['number'].valid }"
            />
          </div>
  
          <div class="uk-margin uk-text-right">
            <button
              class="uk-button uk-button-default"
              (click)="register()"
              id="button-sign-in"
            >
              Cadastrar
            </button>
          </div>
        </div>
      </form>
  
      <p class="uk-text-center">
        <a [routerLink]="['/login']" class="uk-button uk-button-link">Voltar</a>
      </p>
    </div>
  </div>
