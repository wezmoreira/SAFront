<div id="modal-edit" uk-modal>
  <div class="uk-modal-dialog edit-profile-style">
    <button class="uk-modal-close-default" type="button" uk-close></button>
    <div class="uk-modal-header">
      <h2 class="uk-modal-title">Editar Perfil</h2>
    </div>
    <!-- <div class="uk-modal-body"> -->
    <form [formGroup]="form">
      <div class="uk-card uk-card-body uk-box-shadow-small">
        <div class="uk-margin">
          <input
            id="email"
            class="uk-input uk-form-large"
            formControlName="email"
            type="email"
            [placeholder]="user.email"
            [ngClass]="{ 'uk-form-danger': !form.controls['email'].valid }"
          />
        </div>

        <div class="uk-margin">
          <input
            class="uk-input uk-form-large"
            formControlName="username"
            type="text"
            [placeholder]="user.username"
            [ngClass]="{ 'uk-form-danger': !form.controls['username'].valid }"
          />
        </div>

        <div class="uk-margin">
          <input
            class="uk-input uk-form-large"
            formControlName="password"
            type="password"
            placeholder="********"
            [ngClass]="{ 'uk-form-danger': !form.controls['password'].valid }"
          />
        </div>

        <div class="uk-margin" style="display: flex; gap: 10px">
          <input
            style="flex: 4"
            class="uk-input uk-form-large"
            formControlName="city"
            type="text"
            [placeholder]="user.city"
            [ngClass]="{ 'uk-form-danger': !form.controls['city'].valid }"
          />

          <input
            style="flex: 1"
            class="uk-input uk-form-large"
            formControlName="state"
            type="text"
            [placeholder]="user.state"
            [ngClass]="{ 'uk-form-danger': !form.controls['state'].valid }"
            maxlength="2"
          />

          <input
            style="flex: 1"
            class="uk-input uk-form-large"
            formControlName="cep"
            type="text"
            [placeholder]="user.cep"
            [ngClass]="{ 'uk-form-danger': !form.controls['cep'].valid }"
          />
        </div>

        <div class="uk-margin" style="display: flex; gap: 10px">
          <input
            style="flex: 4"
            class="uk-input uk-form-large"
            formControlName="address"
            type="text"
            [placeholder]="user.address"
            [ngClass]="{ 'uk-form-danger': !form.controls['address'].valid }"
          />
          <input
            style="flex: 1"
            class="uk-input uk-form-large"
            formControlName="number"
            type="text"
            [placeholder]="user.number"
            [ngClass]="{ 'uk-form-danger': !form.controls['number'].valid }"
          />
        </div>
      </div>
    </form>
    <!-- </div> -->
    <div class="uk-modal-footer uk-text-right">
      <button
        class="uk-button uk-button-default button-cancel-style uk-modal-close"
        type="button"
      >
        Cancelar
      </button>
      <button
        (click)="onSubmit()"
        class="uk-button uk-button-primary button-save-style uk-modal-close"
        type="button"
      >
        Salvar
      </button>
    </div>
  </div>
</div>
