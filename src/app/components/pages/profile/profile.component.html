  <div class="uk-container">
    <div class="uk-text-center" uk-grid>
      <div class="uk-width-auto@m">
        <div class="uk-card uk-card-default uk-card-body profile-style">
          Avatar
        </div>
      </div>
      <div class="uk-width-1-3@m">
        <div class="uk-card uk-card-default uk-card-body profile-style">
          Solidariedade Anônima
        </div>
      </div>
      <div class="uk-width-expand@m">
        <div class="uk-card uk-card-default uk-card-body profile-style">
          Faça a diferença na vida de alguém!
        </div>
      </div>
    </div>

    <div class="uk-container" style="margin-top: 200px">
      <nav class="uk-navbar-container-default" uk-navbar>
        <div class="uk-navbar-right" style="margin-bottom: 30px">
          <a
            class="uk-button uk-button-default button-79"
            href="#modal-edit"
            uk-toggle
            >Editar perfil</a
          >
          <div>
            <app-edit-profile [user]="user"></app-edit-profile>
          </div>
        </div>
      </nav>
    </div>

    <div
      class="uk-child-width-1-2@s uk-child-width-1-3@m"
      uk-grid="masonry: pack"
    >
      <div>
        <div
          class="uk-card uk-card-default uk-flex uk-flex-center uk-flex-middle profile-style"
          style="height: 100px"
        >
          {{ user.username }}
        </div>
      </div>
      <div>
        <div
          class="uk-card uk-card-default uk-flex uk-flex-center uk-flex-middle profile-style"
          style="height: 150px"
        >
          {{ user.city }}
        </div>
      </div>
      <div>
        <div
          class="uk-card uk-card-default uk-flex uk-flex-center uk-flex-middle profile-style"
          style="height: 300px; text-align: center"
        >
          {{ user.address }}
          <br />
          {{ user.cep }}
        </div>
      </div>
      <div>
        <div
          class="uk-card uk-card-default uk-flex uk-flex-center uk-flex-middle profile-style"
          style="height: 120px"
        >
          {{ user.email }}
        </div>
      </div>
      <div>
        <div
          class="uk-card uk-card-default uk-flex uk-flex-center uk-flex-middle profile-style"
          style="height: 180px"
        >
          {{ user.state }}
        </div>
      </div>
    </div>

    <div uk-modal>
      <div class="uk-modal-dialog">
        <button class="uk-modal-close-default" type="button" uk-close></button>
        <div class="uk-modal-header">
          <h2 class="uk-modal-title"></h2>
        </div>
        <div class="uk-modal-body"></div>
        <div class="uk-modal-footer"></div>
      </div>
    </div>
  </div>
</div>
