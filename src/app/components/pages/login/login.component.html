    <form [formGroup]="form">
      <div
        class="uk-card uk-card-primary uk-card-body uk-box-shadow-small"
        id="login-color"
      >
        <h3 class="uk-card-title">Autentique-se</h3>

        <div class="uk-margin">
          <input
            class="uk-input uk-form-large"
            formControlName="email"
            type="email"
            placeholder="Email"
            [ngClass]="{ 'uk-form-danger': !form.controls['email'].valid }"
          />
        </div>

        <div class="uk-margin">
          <input
            class="uk-input uk-form-large"
            formControlName="password"
            type="password"
            placeholder="Senha"
            [ngClass]="{ 'uk-form-danger': !form.controls['password'].valid }"
          />
        </div>

        <div class="uk-margin uk-text-right">
          <button
            class="uk-button uk-button-default"
            (click)="login()"
            id="button-sign-in"
          >
            Entrar
          </button>
        </div>
      </div>
    </form>

    <p class="uk-text-center">
      <a
        class="uk-button uk-width-1-1 uk-button-large uk-button-primary uk-margin-small-bottom"
        [routerLink]="['/signup']"
        id="login-color"
        >Cadastrar</a
      >
      <br />
      <a class="uk-button uk-button-link" [routerLink]="['/resetpassword']"
        >Esqueci minha senha</a
      >
    </p>
  </div>
</div>
